[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "af-workbench"
version = "1.0.4"
description = "AF Web and MCP scaffold"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0", "fastapi==0.141.1", "uvicorn==0.53.0", "sqlalchemy>=2.0,<3", "jieba==0.42.1", "httpx>=0.28,<1", "pywin32>=312; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["af_app*"]

[tool.setuptools.package-data]
af_app = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
